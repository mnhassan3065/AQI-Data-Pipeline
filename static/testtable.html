<!doctype html>
<html>

<head>
<title>Test Table</title>
<link rel="stylesheet" type="text/css" href="css/test.css">
<link rel="stylesheet" type="text/css" href="css/datatable.css">
<script src="js/jquery-4.0.0.min.js"></script>

<script>
$(function () {
    $.getJSON("/listsensors")
        .done(function (rows) {
            if (!Array.isArray(rows) || rows.length === 0) {
                $("#testtable").html("<p>No sensor data available.</p>");
                return;
            }

            var columns = Object.keys(rows[0]);
            var table = $("<table>").addClass("datatable");
            var head = $("<thead>").appendTo(table);
            var body = $("<tbody>").appendTo(table);

            var headRow = $("<tr>").appendTo(head);
            $.each(columns, function (_, key) {
                $("<th>").text(key).appendTo(headRow);
            });

            $.each(rows, function (_, row) {
                var tr = $("<tr>").appendTo(body);
                $.each(columns, function (_, key) {
                    var value = row[key];
                    $("<td>").text(value === null ? "" : value).appendTo(tr);
                });
            });

            $("#testtable").empty().append(table);
        })
        .fail(function () {
            $("#testtable").html("<p>Could not load sensor data.</p>");
        });
});
</script>

</head>
<body>
<p>Test Table</p>
<div id="testtable"></div>
</body>

</html>
