name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q breathe.py config.py project-bottle.py render_sql.py tests

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Secret pattern scan
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!README.md'; then
            echo "Possible API key found in tracked files" >&2
            exit 1
          fi
          if git ls-files | grep -Eq '(^|/)\.env$|project\.ini$'; then
            echo "Secrets file is tracked" >&2
            exit 1
          fi
